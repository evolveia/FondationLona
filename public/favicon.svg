<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Rounded institutional background square in Fondation Lona navy -->
  <rect width="128" height="128" rx="28" fill="#162E56" />

  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE496" />
      <stop offset="50%" stop-color="#E5BA5A" />
      <stop offset="100%" stop-color="#C69244" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- White Arch -->
    <path
      d="M 22 74 A 42 42 0 0 1 106 74"
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linecap="round"
      fill="none"
    />

    <!-- White Open Book Base with Natural Transparent Center Seam -->
    <path
      d="M 16 72 C 36 84 52 84 62 102 C 58 104 46 104 34 100 C 22 95 18 86 16 72 Z"
      fill="#FFFFFF"
    />
    <path
      d="M 112 72 C 92 84 76 84 66 102 C 70 104 82 104 94 100 C 106 95 110 86 112 72 Z"
      fill="#FFFFFF"
    />

    <!-- Main Center 4-Point Golden Star -->
    <path
      d="M 64 42 Q 64 57 76 57 Q 64 57 64 72 Q 64 57 52 57 Q 64 57 64 42 Z"
      fill="url(#favGold)"
    />

    <!-- Upper Right 4-Point Golden Star -->
    <path
      d="M 86 28 Q 86 36 92 36 Q 86 36 86 44 Q 86 36 80 36 Q 86 36 86 28 Z"
      fill="url(#favGold)"
    />

    <!-- Upper Left 4-Point Golden Star -->
    <path
      d="M 42 38 Q 42 45 47 45 Q 42 45 42 52 Q 42 45 37 45 Q 42 45 42 38 Z"
      fill="url(#favGold)"
    />
  </g>
</svg>
