<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" fill="none">
  <!-- Fondation Lona Typography (Left Side) -->
  <g id="brand-text">
    <text x="16" y="52" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#183D73" letter-spacing="0.5">Fondation</text>
    <text x="14" y="116" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="800" fill="#183D73" letter-spacing="-1">Lona</text>
  </g>

  <!-- Fondation Lona Emblem (Right Side) -->
  <g id="brand-emblem" transform="translate(285, 2)">
    <!-- Arched Halo / Half-Circle Dome -->
    <path d="M 22 84 A 56 56 0 0 1 138 84" stroke="#183D73" stroke-width="14" stroke-linecap="round" fill="none" />

    <!-- Open Book / Curved Foundation Leaves -->
    <path d="M 14 80 C 44 94 68 94 80 118 C 92 94 116 94 146 80 C 142 104 120 120 80 126 C 40 120 18 104 14 80 Z" fill="#183D73" />
    <path d="M 80 102 L 80 126" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

    <!-- Main Golden 4-Pointed Star in Center -->
    <path d="M 80 42 Q 80 62 96 62 Q 80 62 80 82 Q 80 62 64 62 Q 80 62 80 42 Z" fill="#D49B28" />
    <!-- Center star golden core -->
    <circle cx="80" cy="62" r="2.5" fill="#F8E5A0" />

    <!-- Upper Left 4-Pointed Golden Star -->
    <path d="M 52 34 Q 52 44 60 44 Q 52 44 52 54 Q 52 44 44 44 Q 52 44 52 34 Z" fill="#E5B238" />

    <!-- Upper Right 4-Pointed Golden Star -->
    <path d="M 108 22 Q 108 34 118 34 Q 108 34 108 46 Q 108 34 98 34 Q 108 34 108 22 Z" fill="#E5B238" />
  </g>
</svg>
