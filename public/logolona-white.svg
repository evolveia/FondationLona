<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 130" fill="none">
  <defs>
    <!-- Golden Star Gradient -->
    <linearGradient id="lonaGoldWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE598" />
      <stop offset="50%" stop-color="#E8B84B" />
      <stop offset="100%" stop-color="#C28A1C" />
    </linearGradient>
    <radialGradient id="starGlowWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left: Brand Typography in Pure White -->
  <g id="brand-text">
    <text x="12" y="44" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" letter-spacing="0.2">Fondation</text>

    <!-- Custom 'L' with the signature leaf/crescent cutout on inner joint matching official logo -->
    <path d="M 12 58 L 27 58 L 27 94 C 33 89 42 86 52 86 L 68 86 L 68 116 L 12 116 Z" fill="#FFFFFF" />
    <path d="M 27 94 C 27 82 38 72 50 72 L 68 72 L 68 86 C 52 86 42 89 27 94 Z" fill="#0F2648" />

    <!-- 'ona' in bold white matching official logo -->
    <text x="70" y="116" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="-2">ona</text>
  </g>

  <!-- Right: Official Emblem with White Arch & Book + Gold Stars -->
  <g id="brand-emblem" transform="translate(245, 0)">
    <!-- Outer Arch Dome in White -->
    <path d="M 18 80 A 54 54 0 0 1 126 80" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" fill="none" />

    <!-- Open Book / Radiant Foundation Base in White -->
    <path d="M 10 76 C 38 90 60 90 72 114 C 84 90 106 90 134 76 C 130 98 110 114 72 120 C 34 114 14 98 10 76 Z" fill="#FFFFFF" />
    <!-- Book Center Crease Divider -->
    <path d="M 72 98 L 72 120" stroke="#0F2648" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

    <!-- Core Radiant White Spark at Book Apex -->
    <ellipse cx="72" cy="98" rx="9" ry="4.5" fill="url(#starGlowWhite)" />

    <!-- Main Center 4-Point Golden Star -->
    <path d="M 72 40 Q 72 58 86 58 Q 72 58 72 76 Q 72 58 58 58 Q 72 58 72 40 Z" fill="url(#lonaGoldWhite)" />
    <circle cx="72" cy="58" r="2.5" fill="#FFFFFF" />

    <!-- Upper Right Golden Star -->
    <path d="M 98 22 Q 98 32 106 32 Q 98 32 98 42 Q 98 32 90 32 Q 98 32 98 22 Z" fill="url(#lonaGoldWhite)" />

    <!-- Upper Left Golden Star -->
    <path d="M 48 32 Q 48 40 54 40 Q 48 40 48 48 Q 48 40 42 40 Q 48 40 48 32 Z" fill="url(#lonaGoldWhite)" />
  </g>
</svg>
